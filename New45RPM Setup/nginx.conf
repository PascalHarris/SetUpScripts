# Save this as nginx/nginx.conf.
# Main config for the official nginx:1.27-alpine image (paths differ from
# Bitnami's /opt/bitnami/nginx/conf/... layout -- this is the image's own
# default layout, left otherwise unmodified).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Don't advertise the exact nginx version to the world.
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
