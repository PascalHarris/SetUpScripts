# Install to /etc/logrotate.d/45rpm-site
#
# Runs on Ubuntu's normal daily logrotate schedule (cron.daily) -- these
# files are written to continuously by long-running processes, so they
# get rotated weekly regardless of the maintenance.sh quarterly cadence.
# See server-setup-guide.md "Log rotation and disk housekeeping".

/home/pascalharris/lemp-compose/logs/nginx/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        cd /home/pascalharris/lemp-compose && docker compose exec nginx nginx -s reopen 2>/dev/null || true
    endscript
}

/home/pascalharris/lemp-compose/logs/45rpm-php/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    postrotate
        cd /home/pascalharris/lemp-compose && docker compose exec phpfpm-45rpm kill -USR1 1 2>/dev/null || true
    endscript
}
