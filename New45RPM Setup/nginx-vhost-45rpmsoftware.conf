# Save this as nginx/conf.d/45rpmsoftware.conf.

# The ACME HTTP-01 challenge must stay reachable over plain HTTP even
# though everything else below redirects to HTTPS.
server {
    listen 80;
    server_name 45rpmsoftware.com www.45rpmsoftware.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 45rpmsoftware.com www.45rpmsoftware.com;

    ssl_certificate     /etc/letsencrypt/live/45rpmsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/45rpmsoftware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;

    # Never serve dotfiles: .htpasswd, .htaccess, .git, wp-config.php.bak,
    # editor swap files, etc. This is defence-in-depth -- the credentials
    # file itself already lives outside this docroot entirely (see
    # docker-compose.yml and the "auth_basic_user_file" example below).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass phpfpm-45rpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Example: password-protect an admin path with a credentials file that
    # lives OUTSIDE the webroot (./nginx/htpasswd on the host -- see
    # docker-compose.yml), so it is unreachable over HTTP even without the
    # dotfile rule above. Uncomment once wp-admin (or similar) needs it:
    #
    # location /wp-admin/ {
    #     auth_basic "Restricted";
    #     auth_basic_user_file /etc/nginx/htpasswd/45rpmsoftware;
    #     try_files $uri $uri/ /index.php?$args;
    # }
}
