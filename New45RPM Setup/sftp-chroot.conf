# Install to /etc/ssh/sshd_config.d/sftp-chroot.conf
#
# Requires the main /etc/ssh/sshd_config to have:
#   Subsystem sftp internal-sftp
# (internal-sftp runs in-process in sshd, so it works inside a chroot
# without needing binaries/libraries copied into it -- the external
# /usr/lib/openssh/sftp-server path would not.)
#
# Applies only to accounts in the "sftponly" group (created by
# manage-sftp-user.sh) -- pascalharris and any other normal admin account
# are completely unaffected by this block.
Match Group sftponly
    ChrootDirectory %h
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PasswordAuthentication no
